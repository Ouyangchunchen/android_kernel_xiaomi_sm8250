name: CIP136 lmi integration test

on:
  push:
    branches:
      - integration-cip136-base

jobs:
  build-lmi:
    name: lmi ${{ matrix.ksu && 'KSU' || 'NoKSU' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ksu:
          - false
          - true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils \
            lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python-is-python3

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -zxf Clang-16.0.6-20260807.tar.gz

      - name: Build lmi
        run: |
          chmod +x build_kernel.sh
          if [ "${{ matrix.ksu }}" = "true" ]; then
            ./build_kernel.sh lmi ksu
          else
            ./build_kernel.sh lmi
          fi
